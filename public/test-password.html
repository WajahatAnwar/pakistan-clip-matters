<!DOCTYPE html>
<html>
<head>
    <title>Password Hash Test</title>
</head>
<body>
    <h1>Password Hash Test</h1>
    <input type="text" id="password" placeholder="Enter password" value="ClipMatters!9X#Q4@C">
    <button onclick="testPassword()">Test Hash</button>
    <div id="result"></div>
    
    <script>
        const correctPasswordHash = '4b16383c9a097fbbe2149340a10ba326bb640a91fb2485f9c04fbd60b27cbda8';
        
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }
        
        async function testPassword() {
            const password = document.getElementById('password').value;
            const hash = await sha256(password);
            const result = document.getElementById('result');
            
            result.innerHTML = `
                <p><strong>Password:</strong> ${password}</p>
                <p><strong>Generated Hash:</strong> ${hash}</p>
                <p><strong>Expected Hash:</strong> ${correctPasswordHash}</p>
                <p><strong>Match:</strong> ${hash === correctPasswordHash ? '✅ YES' : '❌ NO'}</p>
            `;
        }
        
        // Auto test on load
        window.onload = () => testPassword();
    </script>
</body>
</html>
